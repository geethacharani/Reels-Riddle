<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reels Riddle</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #fff;
  min-height: 100vh;
}

h1 {
  text-align: center;
  padding: 20px;
  font-size: 3rem;
  letter-spacing: 4px;
  text-shadow: 0 0 15px rgba(0,255,255,0.6);
}

.number-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 60px;
  flex-wrap: wrap;
}

.num-btn {
  width: 80px;
  height: 80px;
  font-size: 2rem;
  border-radius: 15px;
  border: none;
  background: #00e5ff;
  color: #000;
  cursor: pointer;
  transition: 0.3s;
}

.num-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00e5ff;
}

.num-btn.locked {
  background: #555;
  color: #aaa;
  cursor: not-allowed;
}

/* MESSAGE SCREEN */
#messageScreen {
  position: fixed;
  inset: 0;
  background: black;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  z-index: 20;
  text-align: center;
}

/* VIDEO */
video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: black;
  display: none;
  z-index: 10;
}

/* QUESTIONS */
#qaScreen {
  display: none;
  padding: 30px;
  height: 100vh;
  overflow-y: auto;
  background: linear-gradient(135deg, #1c1c1c, #2b2b2b);
}

.timer {
  text-align: center;
  font-size: 3rem;
  margin-bottom: 30px;
  color: #ffeb3b;
}

.question {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  font-size: 1.4rem;
}

.answer {
  display: none;
  margin-top: 10px;
  color: #7CFF7C;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>REELS RIDDLE</h1>

<div class="number-container" id="numbers">
  <button class="num-btn" data-index="0">1</button>
  <button class="num-btn" data-index="1">2</button>
  <button class="num-btn" data-index="2">3</button>
  <button class="num-btn" data-index="3">4</button>
  <button class="num-btn" data-index="4">5</button>
  <button class="num-btn" data-index="5">6</button>
  <button class="num-btn" data-index="6">7</button>
</div>

<div id="messageScreen"></div>

<video id="video"></video>

<div id="qaScreen">
  <div class="timer" id="timer">01:30</div>
  <div id="questions"></div>
</div>

<audio id="beep">
  <source src="beep.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ---------- FULLSCREEN HELPERS ---------- */

  function enterFullscreen(el) {
    if (!document.fullscreenElement && el?.requestFullscreen) {
      try {
        el.requestFullscreen();
      } catch {}
    }
  }

  function exitFullscreenSafe() {
    if (document.fullscreenElement) {
      try {
        document.exitFullscreen();
      } catch {}
    }
  }


  /* ---------- VIDEO + QUESTION DATA ---------- */

  const videos = [

    /* 1. INSERTION SORT */
    {
      src: "https://res.cloudinary.com/dr9cu11d5/video/upload/v1766596880/video4_uqrvzd.mp4",

      questions: [
        {
          q: "1) What is the concept demonstrated in the video?",
          a: "Insertion Sort algorithm"
        },
        {
          q: "2) What condition is checked before shifting elements during the sorting process shown in the video?",
          a: "Previous element > Current element"
        },
        {
          q: "3) At the beginning of the sorting process in the video, which portion of the array is considered sorted?",
          a: " first element "
        },
        {
          q: "4) When the input elements are arranged in the most unfavorable order, how many comparisons are performed by this sorting technique as explained in the video?",
          a: "n(n-1)/2"
        }
      ]
    },


    /* 2. MERGE SORT */
    {
      src: "https://res.cloudinary.com/dr9cu11d5/video/upload/v1766596955/video5_pbpfyv.mp4",

      questions: [
        {
          q: "1) What is the concept demonstrated in the video?",
          a: "Merge Sort"
        },
        {
          q: "2) Which algorithmic paradigm does the technique explained in the video?",
          a: "Divide and Conquer"
        },
        {
          q: "3) What is the time complexity of combining two sorted subarrays during the process shown in the video?",
          a: "O(n)"
        },
        {
          q: "4) Which data structure benefits the most from the sorting technique demonstrated in the video?",
          a: "Linked List"
        }
      ]
    },


    /* 3. N-QUEENS */
    {
      src: "https://res.cloudinary.com/dr9cu11d5/video/upload/v1766596836/video3_vru4ol.mp4",

      questions: [
        {
          q: "1) What is the solution for the depicted  example shown in the video?",
          a: "3412"
        },
        {
          q: "2) Which three conditions must be checked before placing a queen on the board during the backtracking process shown in the video?",
          a: "Same column, Left diagonal, Right diagonal"
        },
        {
          q: "3) During the execution shown in the video, how many queens are placed successfully before the first rejection occurs?",
          a: "2"
        },
        {
          q: "4) For a 8-Queens problem how many valid solutions exists?",
          a: "92"
        }
      ]
    },


    /* 4. SELECTION SORT */
    {
      src: "Selection Sort.mp4",

      questions: [
        {
          q: "1) What sorting technique is demonstrated in the above video?",
          a: "Selection Sort"
        },
        {
          q: "2) Which element is selected during each pass?",
          a: "The smallest element from the unsorted portion."
        },
        {
          q: "3) After completing the first two passes, which elements will be in their final positions?",
          a: "The two smallest elements will be in their final positions."
        },
        {
          q: "4) For an array containing n elements, how many comparisons are performed during the complete sorting process?",
          a: "n(n − 1) / 2 comparisons."
        }
      ]
    },


    /* 5. BFS */
    {
      src: "BFS.mp4",

      questions: [
        {
          q: "1) What graph traversal technique is demonstrated in the above shown video?",
          a: "Breadth-First Search (BFS)."
        },
        {
          q: "2) What is the main idea behind the traversal shown in the video?",
          a: "Visiting vertices level by level."
        },
        {
          q: "3) What happens to the neighbouring vertices after the current vertex is removed from the queue?",
          a: "Its unvisited neighbours are added to the queue."
        },
        {
          q: "4) For a graph with V vertices represented using an adjacency matrix, what is the time complexity of the traversal?",
          a: "O(V²)"
        }
      ]
    },


    /* 6. BINARY SEARCH */
    {
      src: "Binary Search.mp4",

      questions: [
        {
          q: "1) What searching technique is demonstrated in the video?",
          a: "Binary Search"
        },
        {
          q: "2) What happens to the search range when the target is greater than the middle element?",
          a: "The left half is discarded, and the right half is searched"
        },
        {
          q: "3) If the search range starts at index 4 and ends at index 15, what will be the middle (mid) index?",
          a: "9"
        },
        {
          q: "4) For a sorted array containing n elements, what is the maximum number of comparisons required in the worst case?",
          a: "O(log n) comparisons."
        }
      ]
    },


    /* 7. DIJKSTRA'S ALGORITHM */
    {
      src: "Dijkstra's Algorithm.mp4",

      questions: [
        {
          q: "1) What problem is the algorithm demonstrated in the video designed to solve?",
          a: "Shortest path"
        },
        {
          q: "2) Which vertex is selected next during the shortest-path process?",
          a: "Minimum-distance vertex"
        },
        {
          q: "3) If a shorter route is discovered, what value is updated?",
          a: "Distance"
        },
        {
          q: "4) Why are negative edge weights unsuitable for this algorithm?",
          a: "They can invalidate finalized distances."
        }
      ]
    }

  ];


  let currentIndex = -1;
  let timerInterval;
  let timeLeft = 90;


  /* ---------- BUTTON HANDLERS ---------- */

  document.querySelectorAll('.num-btn').forEach(btn => {

    btn.addEventListener('click', () => {

      if (btn.classList.contains('locked')) {
        return;
      }

      startFlow(parseInt(btn.dataset.index), btn);

    });

  });


  /* ---------- FLOW ---------- */

  function startFlow(index, btn) {

    btn.classList.add('locked');

    currentIndex = index;

    document.getElementById('numbers').style.display = 'none';

    showMessage("Get ready for the video...");

    setTimeout(playVideo, 10000);

  }


  function showMessage(text) {

    const m = document.getElementById('messageScreen');

    m.textContent = text;

    m.style.display = 'flex';

  }


  function hideMessage() {

    document.getElementById('messageScreen').style.display = 'none';

  }


  /* ---------- VIDEO ---------- */

  function playVideo() {

    hideMessage();

    const v = document.getElementById('video');

    v.src = videos[currentIndex].src;

    v.style.display = 'block';

    v.play();

    enterFullscreen(v);


    v.onended = () => {

      v.style.display = 'none';

      showMessage("Get ready for the questions...");

      setTimeout(showQuestions, 10000);

    };

  }


  /* ---------- QUESTIONS ---------- */

  function showQuestions() {

    hideMessage();

    const qa = document.getElementById('qaScreen');

    qa.style.display = 'block';

    enterFullscreen(qa);


    const qDiv = document.getElementById('questions');

    qDiv.innerHTML = '';


    videos[currentIndex].questions.forEach(q => {

      qDiv.innerHTML += `
        <div class="question">

          <div>${q.q}</div>

          <div class="answer">${q.a}</div>

        </div>
      `;

    });


    startTimer();

  }


  /* ---------- TIMER ---------- */

  function startTimer() {

    timeLeft = 90;

    updateTimer();


    timerInterval = setInterval(() => {

      timeLeft--;

      updateTimer();


      if (timeLeft <= 0) {

        clearInterval(timerInterval);

        document.getElementById('beep').play();


        setTimeout(() => {

          document.querySelectorAll('.answer')
            .forEach(a => a.style.display = 'block');


          setTimeout(endRound, 10000);

        }, 5000);

      }

    }, 1000);

  }


  function updateTimer() {

    const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');

    const s = String(timeLeft % 60).padStart(2, '0');

    document.getElementById('timer').textContent = `${m}:${s}`;

  }


  /* ---------- END ROUND ---------- */

  function endRound() {

    exitFullscreenSafe();

    document.getElementById('qaScreen').style.display = 'none';

    document.getElementById('numbers').style.display = 'flex';

    document.querySelectorAll('.answer')
      .forEach(a => a.style.display = 'none');

  }

});
</script>

</body>
</html>
